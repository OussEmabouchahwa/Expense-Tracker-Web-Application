version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: masrouf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: masrouf
      POSTGRES_PASSWORD: masrouf_dev_password
      POSTGRES_DB: masrouf_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masrouf -d masrouf_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: masrouf-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
